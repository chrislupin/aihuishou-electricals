<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Accountant registration | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .shell { width: min(520px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0; }
      .header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:34px; }.logo { width:154px; height:58px; object-fit:contain; object-position:left center; }
      .card { padding:clamp(24px,5vw,42px); border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.88); box-shadow:0 14px 34px rgba(20,83,136,.09); }
      .eyebrow { color:var(--orange); font:500 11px 'DM Mono', monospace; letter-spacing:1.4px; text-transform:uppercase; } h1 { margin:10px 0 8px; color:var(--blue-deep); font-size:clamp(30px,7vw,46px); letter-spacing:-2px; }.muted { color:var(--muted); font-size:14px; }
      label { display:block; margin:18px 0 6px; color:var(--blue-deep); font-size:13px; font-weight:700; } input { box-sizing:border-box; width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:#f8fcff; color:var(--ink); font:inherit; } input:focus { outline:0; border-color:var(--orange); box-shadow:0 0 0 3px rgba(35,103,255,.12); }
      .btn { display:inline-flex; align-items:center; justify-content:center; margin-top:22px; padding:12px 17px; border:0; border-radius:8px; background:var(--orange); color:#fff; font:700 14px inherit; cursor:pointer; }.btn-ghost { margin-top:0; border:1px solid var(--line); background:#fff; color:var(--blue-deep); }.status { min-height:22px; margin-top:14px; color:var(--muted); font-size:13px; }.status.error { color:#b42318; }.hidden { display:none; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header"><a href="index.html"><img class="logo" src="images/company-logo.png" alt="Aihuishou Electricals" /></a><a class="btn btn-ghost" href="accountant-login.html">Sign in</a></header>
      <section class="card">
        <div class="eyebrow">Accountant portal</div>
        <h1>Register as an accountant</h1>
        <p class="muted">Your registration is reviewed by an administrator before approval access is enabled.</p>
        <form id="accountantSignupForm">
          <label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" maxlength="160" required />
          <label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
          <label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
          <button class="btn" type="submit">Submit registration</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      document.getElementById('accountantSignupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const status = document.getElementById('status');
        const button = form.querySelector('button');
        const data = Object.fromEntries(new FormData(form).entries());
        if (data.password !== data.confirmPassword) { status.className = 'status error'; status.textContent = 'The passwords do not match.'; return; }
        button.disabled = true; status.className = 'status'; status.textContent = 'Submitting registration…';
        try {
          const response = await fetch('/api/accountant-applications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || 'Unable to submit your registration.');
          form.reset(); status.textContent = result.message || 'Registration submitted for review.';
        } catch (error) { status.className = 'status error'; status.textContent = error.message || 'Unable to submit your registration.'; }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
