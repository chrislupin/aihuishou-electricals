<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field employee access | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .access-shell { width: min(520px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0; }
      .access-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 34px; }
      .portal-logo { width: 154px; height: 58px; object-fit: contain; object-position: left center; }
      .access-card { padding: clamp(24px, 5vw, 42px); border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.88); box-shadow: 0 14px 34px rgba(20,83,136,.09); }
      .eyebrow { color: var(--orange); font: 500 11px 'DM Mono', monospace; letter-spacing: 1.4px; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; color: var(--blue-deep); font-size: clamp(30px, 7vw, 46px); letter-spacing: -2px; }
      .muted { color: var(--muted); font-size: 14px; }
      label { display: block; margin: 18px 0 6px; color: var(--blue-deep); font-size: 13px; font-weight: 700; }
      input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #f8fcff; color: var(--ink); font: inherit; }
      input:focus { outline: 0; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(35,103,255,.12); }
      .password-field { position: relative; }
      .password-field input { padding-right: 52px; }
      .password-toggle { position: absolute; top: 50%; right: 6px; display: grid; width: 36px; height: 36px; padding: 0; place-items: center; transform: translateY(-50%); border: 0; border-radius: 6px; background: transparent; color: var(--orange); cursor: pointer; }
      .password-toggle:hover { background: rgba(35,103,255,.08); }
      .password-toggle:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
      .password-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .password-toggle .eye-slash { display: none; }.password-toggle.is-visible .eye-slash { display: block; }
      .honeypot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 22px; padding: 12px 17px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; font: 700 14px inherit; cursor: pointer; }
      .status { min-height: 22px; margin-top: 14px; color: var(--muted); font-size: 13px; }
      .status.error { color: #b42318; }
      .auth-switch { margin-top: 20px; color: var(--muted); font-size: 13px; }
      .auth-switch button { border: 0; background: none; color: var(--orange); font: 700 13px inherit; cursor: pointer; }
      .auth-form.is-hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="access-shell">
      <header class="access-header"><a href="index.html"><img class="portal-logo" src="images/company-logo.png" alt="Aihuishou Electricals" /></a><a class="btn btn-ghost" href="index.html">Home</a></header>
      <section class="access-card">
        <div class="eyebrow">Field employee portal</div>
        <h1>Field collection reports</h1>
        <p class="muted">Sign in to report collected goods to the operations team.</p>
        <form id="fieldLoginForm">
          <label for="fieldEmail">Email address</label><input id="fieldEmail" name="email" type="email" autocomplete="username" required />
          <label for="fieldPassword">Password</label><div class="password-field"><input id="fieldPassword" name="password" type="password" autocomplete="current-password" required /><button class="password-toggle" type="button" aria-controls="fieldPassword" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></div>
          <button class="btn" type="submit">Open field dashboard</button>
          <p class="auth-switch"><a href="password-reset.html">Forgot your password?</a></p>
          <p class="status" id="fieldStatus" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch" id="signupPrompt">New field employee? <button type="button">Create an account</button></p>
        <form id="fieldSignupForm" class="auth-form is-hidden">
          <label for="signupName">Full name</label><input id="signupName" name="fullName" required />
          <label for="signupPhone">Phone number</label><input id="signupPhone" name="phone" inputmode="tel" required />
          <label for="signupEmail">Email address</label><input id="signupEmail" name="email" type="email" autocomplete="email" required />
          <label for="signupPassword">Create password</label><div class="password-field"><input id="signupPassword" name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required /><button class="password-toggle" type="button" aria-controls="signupPassword" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></div>
          <div class="honeypot" aria-hidden="true"><label>Leave this field empty<input name="website" type="text" tabindex="-1" autocomplete="off" /></label></div>
          <button class="btn" type="submit">Create field employee account</button>
          <p class="status" id="signupStatus" role="status" aria-live="polite"></p>
          <p class="auth-switch"><button id="loginPrompt" type="button">Return to sign in</button></p>
        </form>
      </section>
    </main>
    <script>
      const loginForm = document.getElementById('fieldLoginForm');
      const signupForm = document.getElementById('fieldSignupForm');
      const signupPrompt = document.getElementById('signupPrompt');
      document.querySelectorAll('.password-toggle').forEach((button) => button.addEventListener('click', () => { const input = document.getElementById(button.getAttribute('aria-controls')); const visible = input.type === 'text'; input.type = visible ? 'password' : 'text'; button.classList.toggle('is-visible', !visible); button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password'); button.setAttribute('aria-pressed', String(!visible)); }));
      signupPrompt.querySelector('button').addEventListener('click', () => { loginForm.classList.add('is-hidden'); signupPrompt.classList.add('is-hidden'); signupForm.classList.remove('is-hidden'); });
      document.getElementById('loginPrompt').addEventListener('click', () => { signupForm.classList.add('is-hidden'); loginForm.classList.remove('is-hidden'); signupPrompt.classList.remove('is-hidden'); });
      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button');
        const status = document.getElementById('fieldStatus');
        button.disabled = true;
        status.className = 'status';
        status.textContent = 'Signing in...';
        try {
          const response = await fetch('/api/field-employee-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to sign in.');
          window.location.assign('field-employee-dashboard.html');
        } catch (error) { status.className = 'status error'; status.textContent = error.message || 'Unable to sign in.'; }
        finally { button.disabled = false; }
      });
      signupForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = signupForm.querySelector('button[type="submit"]');
        const status = document.getElementById('signupStatus');
        button.disabled = true;
        status.className = 'status';
        status.textContent = 'Creating account...';
        try {
          const response = await fetch('/api/field-employee-signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(signupForm).entries())) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to create account.');
          window.location.assign('field-employee-dashboard.html');
        } catch (error) { status.className = 'status error'; status.textContent = error.message || 'Unable to create account.'; }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
