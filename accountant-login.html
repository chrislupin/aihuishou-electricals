<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accountant access | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .shell { width: min(520px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0; }.header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:34px; }.logo { width:154px; height:58px; object-fit:contain; object-position:left center; }.card { padding:clamp(24px,5vw,42px); border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.88); box-shadow:0 14px 34px rgba(20,83,136,.09); }.eyebrow { color:var(--orange); font:500 11px 'DM Mono', monospace; letter-spacing:1.4px; text-transform:uppercase; } h1 { margin:10px 0 8px; color:var(--blue-deep); font-size:clamp(30px,7vw,46px); letter-spacing:-2px; }.muted { color:var(--muted); font-size:14px; } label { display:block; margin:18px 0 6px; color:var(--blue-deep); font-size:13px; font-weight:700; } input { box-sizing:border-box; width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:#f8fcff; color:var(--ink); font:inherit; } input:focus { outline:0; border-color:var(--orange); box-shadow:0 0 0 3px rgba(35,103,255,.12); }.btn { display:inline-flex; align-items:center; justify-content:center; margin-top:22px; padding:12px 17px; border:0; border-radius:8px; background:var(--orange); color:#fff; font:700 14px inherit; cursor:pointer; }.btn-ghost { margin-top:0; border:1px solid var(--line); background:#fff; color:var(--blue-deep); }.status { min-height:22px; margin-top:14px; color:var(--muted); font-size:13px; }.status.error { color:#b42318; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header"><a href="index.html"><img class="logo" src="images/company-logo.png" alt="Aihuishou Electricals" /></a><a class="btn btn-ghost" href="index.html">Back</a></header>
      <section class="card">
        <div class="eyebrow">Operations console</div>
        <h1>Accountant sign in</h1>
        <p class="muted">Review and approve operational pickups, dates and tickets.</p>
        <form id="accountantLoginForm">
          <label for="email">Accountant email</label><input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required />
          <button class="btn" type="submit">Open approvals</button>
          <p class="muted"><a href="accountant-signup.html">New accountant? Register for approval</a> · <a href="password-reset.html">Forgot your password?</a></p>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      document.getElementById('accountantLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); const status = document.getElementById('status'); button.disabled = true; status.className = 'status'; status.textContent = 'Signing in…';
        try { const response = await fetch('/api/accountant-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Unable to sign in.'); location.assign('admin-dashboard.html?role=accountant'); }
        catch (error) { status.className = 'status error'; status.textContent = error.message || 'Unable to sign in.'; }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
