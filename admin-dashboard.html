<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Aihuishou</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: 255px 1fr; min-height: 100vh; }
      .side { padding: 25px 18px; background: var(--blue-deep); }
      .side img { width: 150px; height: 58px; object-fit: contain; }
      .nav { display: grid; gap: 8px; margin-top: 28px; }
      .nav a { padding: 12px; border-radius: 8px; color: #dcecff; text-decoration: none; font-size: 14px; font-weight: 700; }
      .nav a.active, .nav a:hover { background: #ffffff24; color: #fff; }
      .page { width: min(1020px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 60px; }
      .header, .filters, .account { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .btn { padding: 10px 14px; border: 1px solid transparent; border-radius: 8px; background: var(--orange); color: #fff; font: 700 14px inherit; cursor: pointer; }
      .btn:disabled { cursor: default; opacity: .7; }
      .ghost { border-color: var(--line); background: #fff; color: var(--blue-deep); }
      .danger { background: #b42318; }
      h1, h2, h3 { color: var(--blue-deep); }
      .muted { color: var(--muted); }
      .filters { justify-content: flex-start; margin: 25px 0; }
      .filters select { padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      .filters label { color: var(--blue-deep); font-size: 13px; font-weight: 700; }
      .card, .empty { margin: 12px 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 10px 24px #14538812; }
      .summary { width: 100%; margin: 12px 0 28px; border: 1px solid var(--line); border-collapse: collapse; background: #fff; }
      .summary th, .summary td { padding: 11px; border-bottom: 1px solid var(--line); text-align: left; }
      .summary th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
      .request-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .request-top h3 { margin: 0; }
      .request-top p { margin: 5px 0 0; }
      .badge { display: inline-block; padding: 5px 8px; border-radius: 999px; background: #e5f2ff; color: var(--blue-deep); font-size: 12px; font-weight: 700; }
      .details { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
      .details div { padding-top: 8px; border-top: 1px solid var(--line); }
      .details strong { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
      .request-total { color: var(--blue-deep); font-size: 18px; font-weight: 800; }
      .actions { margin-top: 16px; }
      @media (max-width: 900px) { .details { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { padding: 14px; } .nav { grid-template-columns: repeat(2, 1fr); margin-top: 8px; } .page { width: min(100% - 28px, 1020px); } .details { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <a href="admin-dashboard.html"><img src="images/company-logo.png" alt="Aihuishou Electricals" /></a>
        <nav class="nav">
          <a data-view="overview" href="admin-dashboard.html">Overview &amp; unapproved</a>
          <a data-view="approved-agents" href="admin-dashboard.html?view=approved-agents">Approved agent requests</a>
          <a data-view="approved-fields" href="admin-dashboard.html?view=approved-fields">Approved field employee requests</a>
          <a data-view="accounts" href="admin-dashboard.html?view=accounts">Manage employees and agents</a>
          <a href="admin-analysis.html">Analysis</a>
        </nav>
      </aside>
      <section class="page">
        <header class="header">
          <h1 id="title"></h1>
          <div>
            <button class="btn ghost" id="refresh" type="button">Refresh</button>
            <button class="btn ghost" id="logout" type="button">Log out</button>
          </div>
        </header>
        <div id="view"></div>
      </section>
    </main>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const viewName = new URLSearchParams(location.search).get('view') || 'overview';
      const root = $('#view');
      const titles = {
        overview: 'Pickup request inbox',
        'approved-agents': 'Approved agent requests',
        'approved-fields': 'Approved field employee requests',
        accounts: 'Manage employees and agents'
      };
      let requests = [];
      let accounts = [];

      $('#title').textContent = titles[viewName] || titles.overview;
      document.querySelector(`[data-view="${viewName}"]`)?.classList.add('active');

      const isField = (request) => request.requestType === 'fieldEmployee';
      const roleName = (request) => isField(request) ? 'Field employee' : 'Agent';
      const formatDate = (value) => new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
      const formatAmount = (amount) => Number(amount || 0).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const requestTotal = (request) => {
        const saved = Number(request.totalAmount);
        if (Number.isFinite(saved)) return saved;
        return (request.goods || []).reduce((total, good) => {
          const lineTotal = Number(good.totalAmount);
          if (Number.isFinite(lineTotal)) return total + lineTotal;
          const quantity = Number(good.quantity);
          const amount = Number(good.amount);
          return Number.isFinite(quantity) && Number.isFinite(amount) ? total + quantity * amount : total;
        }, 0);
      };

      function showEmpty(container, message) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = message;
        container.replaceChildren(empty);
      }

      function requestCard(request) {
        const agent = request.agent || {};
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = '<div class="request-top"><div><h3></h3><p class="muted"></p></div><span class="badge"></span></div><div class="details"><div><strong>Employee / agent</strong><span class="name"></span></div><div><strong>Goods and number</strong><span class="goods"></span></div><div><strong>Combined total amount</strong><span class="request-total"></span></div><div><strong>Pickup time</strong><span class="time"></span></div><div><strong>Location / notes</strong><span class="notes"></span></div></div><div class="actions"></div>';
        card.querySelector('h3').textContent = `${roleName(request)} request`;
        card.querySelector('.muted').textContent = formatDate(request.createdAt);
        card.querySelector('.badge').textContent = request.status || 'Pending approval';
        card.querySelector('.name').textContent = agent.fullName || request.agentEmail || '—';
        card.querySelector('.goods').textContent = (request.goods || []).map((good) => `${good.name}: ${good.quantity}`).join(', ') || '—';
        card.querySelector('.request-total').textContent = formatAmount(requestTotal(request));
        card.querySelector('.time').textContent = request.preferredTime || 'Not provided';
        card.querySelector('.notes').textContent = [request.location, request.notes].filter(Boolean).join(' · ') || '—';

        if (request.status !== 'Approved') {
          const approve = document.createElement('button');
          approve.className = 'btn';
          approve.type = 'button';
          approve.textContent = 'Approve request';
          approve.addEventListener('click', async () => {
            approve.disabled = true;
            const response = await fetch(`/api/admin/pickup-requests/${encodeURIComponent(request.id)}/approve`, { method: 'POST' });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              alert(result.error || 'Unable to approve this request.');
              approve.disabled = false;
              return;
            }
            load();
          });
          card.querySelector('.actions').append(approve);
        }

        return card;
      }

      function listRequests(container, items, emptyMessage) {
        if (!items.length) {
          showEmpty(container, emptyMessage);
          return;
        }
        container.replaceChildren(...items.map(requestCard));
      }

      function renderSummary(items) {
        const target = $('#summary');
        const people = new Map();
        items.forEach((request) => {
          const agent = request.agent || {};
          const id = request.agentEmail || agent.email || 'unknown';
          const person = people.get(id) || { name: agent.fullName || id, role: roleName(request), goods: new Map(), total: 0 };
          (request.goods || []).forEach((good) => person.goods.set(good.name, (person.goods.get(good.name) || 0) + (Number(good.quantity) || 0)));
          person.total += requestTotal(request);
          people.set(id, person);
        });
        if (!people.size) {
          showEmpty(target, 'No goods were recorded for this selection.');
          return;
        }
        const table = document.createElement('table');
        table.className = 'summary';
        table.innerHTML = '<thead><tr><th>Employee / agent</th><th>Role</th><th>Goods and total number</th><th>Combined amount</th></tr></thead>';
        const body = document.createElement('tbody');
        people.forEach((person) => {
          const row = document.createElement('tr');
          [person.name, person.role, [...person.goods].map(([name, quantity]) => `${name}: ${quantity}`).join(', '), formatAmount(person.total)].forEach((value) => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.append(cell);
          });
          body.append(row);
        });
        table.append(body);
        target.replaceChildren(table);
      }

      function renderFiltersAndRequests() {
        root.innerHTML = '<section class="filters"><label>Person <select id="person"><option value="">All employees and agents</option></select></label><label>Status <select id="status"><option value="all">All statuses</option><option value="Pending approval">Pending approval</option><option value="Approved">Approved</option></select></label></section>' + (viewName === 'overview' ? '<h2>Selected collection summary</h2><div id="summary"></div><h2>Unapproved agent requests</h2><div id="agents"></div><h2>Unapproved field employee requests</h2><div id="fields"></div>' : '<p class="muted">Only approved requests are displayed on this page.</p><div id="results"></div>');
        const personSelect = $('#person');
        accounts.forEach((account) => personSelect.add(new Option(`${account.fullName} — ${account.role === 'fieldEmployee' ? 'Field employee' : 'Agent'}`, account.email)));
        const statusSelect = $('#status');
        const draw = () => {
          let selected = requests.filter((request) => (!personSelect.value || request.agentEmail === personSelect.value) && (statusSelect.value === 'all' || request.status === statusSelect.value));
          if (viewName === 'overview') {
            renderSummary(selected);
            selected = selected.filter((request) => request.status !== 'Approved');
            listRequests($('#agents'), selected.filter((request) => !isField(request)), 'No unapproved agent requests match these filters.');
            listRequests($('#fields'), selected.filter(isField), 'No unapproved field employee requests match these filters.');
          } else {
            listRequests($('#results'), selected, 'No requests match these filters.');
          }
        };
        personSelect.addEventListener('change', draw);
        statusSelect.addEventListener('change', draw);
        draw();
      }

      function renderAccounts() {
        root.innerHTML = '<p class="muted">Deleting an account permanently removes its login access. Existing request records are retained.</p><div id="accounts"></div>';
        const target = $('#accounts');
        if (!accounts.length) {
          showEmpty(target, 'No accounts have been created yet.');
          return;
        }
        accounts.forEach((account) => {
          const card = document.createElement('article');
          card.className = 'card account';
          const details = document.createElement('div');
          const name = document.createElement('strong');
          const meta = document.createElement('div');
          name.textContent = account.fullName;
          meta.className = 'muted';
          meta.textContent = `${account.role === 'fieldEmployee' ? 'Field employee' : 'Agent'} · ${account.email}`;
          details.append(name, meta);
          const remove = document.createElement('button');
          remove.className = 'btn danger';
          remove.type = 'button';
          remove.textContent = 'Delete account';
          remove.addEventListener('click', async () => {
            if (!confirm(`Delete ${account.fullName}'s account? This cannot be undone.`)) return;
            const response = await fetch(`/api/admin/accounts/${encodeURIComponent(account.email)}`, { method: 'DELETE' });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              alert(result.error || 'Unable to delete this account.');
              return;
            }
            load();
          });
          card.append(details, remove);
          target.append(card);
        });
      }

      async function load() {
        root.replaceChildren();
        try {
          const [requestResponse, accountResponse] = await Promise.all([fetch('/api/admin/pickup-requests'), fetch('/api/admin/accounts')]);
          if (requestResponse.status === 401 || accountResponse.status === 401) {
            location.assign('admin-login.html');
            return;
          }
          const requestData = await requestResponse.json();
          const accountData = await accountResponse.json();
          if (!requestResponse.ok) throw new Error(requestData.error || 'Unable to load pickup requests.');
          if (!accountResponse.ok) throw new Error(accountData.error || 'Unable to load accounts.');
          requests = requestData.requests || [];
          accounts = accountData.accounts || [];
          if (viewName === 'approved-agents') requests = requests.filter((request) => !isField(request) && request.status === 'Approved');
          if (viewName === 'approved-fields') requests = requests.filter((request) => isField(request) && request.status === 'Approved');
          viewName === 'accounts' ? renderAccounts() : renderFiltersAndRequests();
        } catch (error) {
          showEmpty(root, error.message || 'Unable to load the admin dashboard.');
        }
      }

      $('#refresh').addEventListener('click', load);
      $('#logout').addEventListener('click', async () => {
        await fetch('/api/admin-logout', { method: 'POST' });
        location.assign('admin-login.html');
      });
      load();
    </script>
  </body>
</html>
