<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Aihuishou</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f4f7fb; color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.45; }
      .app { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; }
      .side { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 28px 18px; overflow-y: auto; background: radial-gradient(circle at 12% 8%, #2878b8 0, transparent 31%), linear-gradient(160deg, #082f57 0%, var(--blue-deep) 62%, #071f3b 100%); box-shadow: 12px 0 32px #08264718; }
      .side-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { display: block; width: fit-content; padding: 8px 10px; border: 1px solid #ffffff1f; border-radius: 12px; background: #ffffff0b; }
      .side img { display: block; width: 150px; height: 48px; object-fit: contain; object-position: left center; }
      .nav-toggle { display: none; }
      .nav-label { margin: 31px 10px 9px; color: #a9cce8; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      .nav { display: flex; flex: 1; flex-direction: column; gap: 6px; }
      .nav a { position: relative; display: flex; align-items: center; min-height: 44px; padding: 11px 13px 11px 17px; border: 1px solid transparent; border-radius: 10px; color: #dcecff; text-decoration: none; font-size: 14px; font-weight: 700; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
      .nav a::before { width: 5px; height: 5px; margin-right: 10px; border-radius: 50%; background: #8dc7ef; content: ''; opacity: .72; }
      .nav a.active { border-color: #ffffff25; background: linear-gradient(90deg, #ffffff2c, #ffffff13); color: #fff; box-shadow: 0 8px 18px #031b351c; }
      .nav a.active::before { background: var(--orange); box-shadow: 0 0 0 4px #ff9b4926; opacity: 1; }
      .nav a:hover { border-color: #ffffff20; background: #ffffff14; color: #fff; transform: translateX(2px); }
      .nav a:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #f7ad67; outline-offset: 3px; }
      .page { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 42px 0 72px; }
      .header, .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .header { padding-bottom: 22px; border-bottom: 1px solid #dbe6f0; }
      .header h1 { margin: 0; font-size: clamp(29px, 4vw, 42px); letter-spacing: -1.4px; }
      .header-actions { display: flex; align-items: center; padding: 4px; border: 1px solid #d8e5ef; border-radius: 12px; background: #edf4fa; box-shadow: 0 5px 15px #1453880b; }
      .btn { min-height: 42px; padding: 10px 15px; border: 1px solid transparent; border-radius: 9px; background: var(--orange); box-shadow: 0 5px 12px #d15b1b24; color: #fff; font: 700 14px inherit; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
      .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 17px #d15b1b30; }
      .btn:disabled { cursor: wait; opacity: .65; }
      .ghost { border-color: var(--line); background: #fff; box-shadow: none; color: var(--blue-deep); }
      #refresh { display: inline-flex; align-items: center; gap: 8px; border-color: transparent; background: #fff; box-shadow: 0 2px 7px #14538812; }
      #refresh::before { display: inline-grid; width: 20px; height: 20px; place-items: center; border-radius: 6px; background: #e7f3fc; color: var(--blue-mid); content: '↻'; font-size: 16px; line-height: 1; }
      .nav-footer { margin-top: auto; padding-top: 17px; border-top: 1px solid #ffffff20; }
      .side-logout { display: flex; align-items: center; width: 100%; min-height: 43px; gap: 9px; padding: 10px 13px; border: 1px solid #ffffff28; border-radius: 10px; background: #ffffff0d; color: #e6f2fc; font: 700 13px inherit; cursor: pointer; transition: background .16s ease, border-color .16s ease; }
      .side-logout::before { content: '↪'; color: #f7ad67; font-size: 18px; line-height: 1; }
      .side-logout:hover { border-color: #ffffff4b; background: #ffffff1c; }
      .side-logout:focus-visible { outline: 3px solid #f7ad67; outline-offset: 3px; }
      .danger { background: #b42318; }
      h1, h2, h3 { color: var(--blue-deep); }
      .muted { color: var(--muted); }
      .filters { justify-content: flex-start; margin: 25px 0; }
      .filters select, .filters input { min-height: 42px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8fcff; color: var(--ink); font: inherit; }
      .filters label { color: var(--blue-deep); font-size: 13px; font-weight: 700; }
      .card, .empty { margin: 14px 0; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 12px 28px #14538812; }
      .account { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; }
      .account > div:first-child { min-width: 0; overflow-wrap: anywhere; }
      .account-actions { display: grid; grid-template-columns: repeat(3, 156px); gap: 12px; align-items: center; }
      .account-actions .btn { width: 100%; white-space: nowrap; }
      .account-actions .account-delete { grid-column: 3; }
      .summary-wrap { margin: 12px 0 28px; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 10px 24px #14538812; }
      .summary { width: 100%; min-width: 900px; border-collapse: collapse; background: #fff; }
      .summary th, .summary td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
      .summary th { background: #f4faff; color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
      .summary td { color: var(--ink); font-size: 13px; }
      .summary tbody tr:last-child td { border-bottom: 0; }
      .summary tbody tr:hover { background: #f8fcff; }
      .summary .summary-person { color: var(--blue-deep); font-weight: 800; }
      .summary .summary-count { font-weight: 800; text-align: center; }
      .summary .summary-total { color: var(--blue-deep); font-weight: 800; white-space: nowrap; }
      .request-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .request-top h3 { margin: 0; }
      .request-top p { margin: 5px 0 0; }
      .badge { display: inline-block; padding: 5px 8px; border-radius: 999px; background: #e5f2ff; color: var(--blue-deep); font-size: 12px; font-weight: 700; }
      .details { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
      .details div { padding-top: 8px; border-top: 1px solid var(--line); }
      .details strong { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
      .request-total { color: var(--blue-deep); font-size: 18px; font-weight: 800; }
      .actions { margin-top: 16px; }
      .date-approval-intro { margin: -10px 0 18px; }
      .date-approval-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 10px 24px #14538812; }
      .date-approval-table { width: 100%; min-width: 920px; border-collapse: collapse; }
      .date-approval-table th, .date-approval-table td { padding: 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      .date-approval-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
      .date-approval-table td { color: var(--ink); font-size: 13px; }
      .date-approval-table tbody tr:hover { background: #f8fcff; }
      .date-approval-table .person { color: var(--blue-deep); font-weight: 800; }
      .date-approval-table .amount { color: var(--blue-deep); font-weight: 800; white-space: nowrap; }
      .approval-actions { display: flex; gap: 7px; flex-wrap: wrap; }
      .approval-actions .btn { white-space: nowrap; }
      .badge.approved { background: #ddf7e7; color: #126337; }
      .badge.rejected { background: #ffe3e3; color: #8d2020; }
      @media (max-width: 900px) { .app { grid-template-columns: 224px minmax(0, 1fr); } .details { grid-template-columns: repeat(2, minmax(0, 1fr)); } .account { grid-template-columns: 1fr; } .account-actions { justify-self: stretch; } .page { width: min(100% - 42px, 1120px); } }
      @media (max-width: 760px) { .app { display: block; } .side { position: static; display: block; height: auto; padding: 12px 14px 13px; overflow: visible; } .brand { padding: 2px 7px; border: 0; background: transparent; } .side img { width: 132px; height: 38px; } .nav-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 12px; border: 1px solid #ffffff33; border-radius: 10px; background: #ffffff12; color: #fff; font: 800 12px inherit; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; } .nav-toggle-icon, .nav-toggle-icon::before, .nav-toggle-icon::after { display: block; width: 18px; height: 2px; border-radius: 2px; background: currentColor; content: ''; transition: transform .18s ease, opacity .18s ease; } .nav-toggle-icon { position: relative; } .nav-toggle-icon::before { position: absolute; top: -6px; } .nav-toggle-icon::after { position: absolute; top: 6px; } .nav-toggle[aria-expanded="true"] .nav-toggle-icon { background: transparent; } .nav-toggle[aria-expanded="true"] .nav-toggle-icon::before { top: 0; transform: rotate(45deg); } .nav-toggle[aria-expanded="true"] .nav-toggle-icon::after { top: 0; transform: rotate(-45deg); } .nav-label { display: none; } .nav { display: none; margin-top: 12px; padding: 10px; border: 1px solid #ffffff1c; border-radius: 14px; background: #041f3bc9; box-shadow: 0 14px 28px #031b3538; } .nav.is-open { display: flex; animation: reveal-menu .18s ease-out; } .nav-footer { margin-top: 8px; padding-top: 10px; } .nav a { min-height: 44px; padding: 11px 12px; font-size: 14px; } .nav a:hover { transform: none; } .page { width: min(100% - 28px, 1120px); padding: 28px 0 52px; } .header { align-items: center; padding-bottom: 17px; } .details { grid-template-columns: 1fr; } .account-actions { grid-template-columns: 1fr; } .account-actions .account-delete { grid-column: auto; } } @keyframes reveal-menu { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 430px) { .header { align-items: flex-start; } .header-actions { width: 100%; } .header-actions .btn { flex: 1; } .card, .empty { padding: 16px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <div class="side-top"><a class="brand" href="admin-dashboard.html"><img src="images/company-logo.png" alt="Aihuishou Electricals" /></a><button class="nav-toggle" id="navToggle" type="button" aria-controls="operationsNav" aria-expanded="false"><span class="nav-toggle-icon" aria-hidden="true"></span><span>Menu</span></button></div>
        <p class="nav-label">Operations workspace</p>
        <nav class="nav" id="operationsNav" aria-label="Operations navigation">
          <a data-view="overview" href="admin-dashboard.html">Overview &amp; unapproved</a>
          <a class="admin-only" data-view="applications" href="admin-dashboard.html?view=applications">Agent applications</a>
          <a data-view="pickup-dates" href="admin-dashboard.html?view=pickup-dates">Pickup dates approval</a>
          <a data-view="approved-fields" href="admin-dashboard.html?view=approved-fields">Ticket Center</a>
          <a data-view="expenses" href="expenses.html">Expenses</a>
          <a data-view="goods" href="goods.html">Inventory</a>
          <a class="admin-only" data-view="accounts" href="admin-dashboard.html?view=accounts">Manage accounts</a>
          <a data-view="analysis" href="admin-analysis.html">Analysis</a>
          <a class="admin-only" href="admin-audit.html">Audit log</a>
          <div class="nav-footer"><button class="side-logout" id="logout" type="button">Log out</button></div>
        </nav>
      </aside>
      <section class="page">
        <header class="header">
          <h1 id="title"></h1>
          <div class="header-actions"><button class="btn ghost" id="refresh" type="button">Refresh data</button></div>
        </header>
        <div id="view"></div>
      </section>
    </main>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const navToggle = $('#navToggle');
      const operationsNav = $('#operationsNav');
      navToggle?.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!expanded));
        operationsNav.classList.toggle('is-open', !expanded);
      });
      const params = new URLSearchParams(location.search);
      const portalRole = params.get('role') === 'accountant' ? 'accountant' : 'admin';
      const canApprove = portalRole === 'accountant';
      const viewName = params.get('view') || 'overview';
      if (portalRole === 'accountant' && !['overview', 'pickup-dates', 'approved-fields'].includes(viewName)) location.replace('admin-dashboard.html?role=accountant');
      const root = $('#view');
      const titles = {
        overview: 'Overview & approvals',
        applications: 'Agent applications',
        'pickup-dates': 'Pickup dates approval',
        'approved-fields': 'Ticket Center',
        accounts: 'Manage employees and agents'
      };
      let requests = [];
      let pickupDateRequests = [];
      let accounts = [];
      let applications = [];
      let accountantApplications = [];

      if (portalRole === 'accountant') {
        document.querySelectorAll('.admin-only').forEach((element) => element.remove());
        document.querySelector('[data-view="overview"]').textContent = 'Overview & approved';
        document.querySelectorAll('.nav a[data-view]').forEach((link) => {
          if (link.dataset.view === 'expenses') {
            link.href = 'expenses.html?role=accountant';
            return;
          }
          if (link.dataset.view === 'goods') {
            link.href = 'goods.html?role=accountant';
            return;
          }
          if (link.dataset.view === 'analysis') {
            link.href = 'admin-analysis.html?role=accountant';
            return;
          }
          const linkParams = new URL(link.href).searchParams;
          linkParams.set('role', 'accountant');
          link.href = `admin-dashboard.html?${linkParams}`;
        });
      }
      $('#title').textContent = portalRole === 'accountant' && viewName === 'overview' ? 'Accountant approvals' : (titles[viewName] || titles.overview);
      document.querySelector(`[data-view="${viewName}"]`)?.classList.add('active');

      const isField = (request) => request.requestType === 'fieldEmployee';
      const isAgentTicket = (request) => request.requestType === 'agentTicket';
      const isPickupRequest = (request) => !isField(request) && !isAgentTicket(request);
      const reportDateFor = (request) => !isPickupRequest(request) && request.status === 'Approved'
        ? (request.approvedAt || request.updatedAt || request.resubmittedAt || request.createdAt)
        : (request.resubmittedAt || request.createdAt);
      const roleName = (request) => isField(request) ? 'Field employee' : 'Agent';
      const requestName = (request) => isField(request) ? 'Field employee ticket' : isAgentTicket(request) ? 'Agent ticket' : 'Pickup request';
      const formatDate = (value) => new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
      const formatPickupDate = (value) => { if (!value) return 'Flexible / not provided'; const date = new Date(`${value}T00:00:00`); return /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(date.getTime()) ? new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium' }).format(date) : value; };
      const formatAmount = (amount) => Number(amount || 0).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const requestTotal = (request) => {
        const saved = Number(request.totalAmount);
        if (Number.isFinite(saved)) return saved;
        return (request.goods || []).reduce((total, good) => {
          const lineTotal = Number(good.totalAmount);
          if (Number.isFinite(lineTotal)) return total + lineTotal;
          const quantity = Number(good.quantity);
          const amount = Number(good.amount);
          return Number.isFinite(quantity) && Number.isFinite(amount) ? total + quantity * amount : total;
        }, 0);
      };
      const isWithinDateRange = (request, fromValue, toValue) => {
        const reportDate = new Date(reportDateFor(request));
        if (Number.isNaN(reportDate.getTime())) return false;
        const from = fromValue ? new Date(`${fromValue}T00:00:00`) : null;
        const to = toValue ? new Date(`${toValue}T23:59:59.999`) : null;
        return (!from || reportDate >= from) && (!to || reportDate <= to);
      };

      function showEmpty(container, message) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = message;
        container.replaceChildren(empty);
      }

      function addRequestDetail(details, label, value, className = '') {
        const item = document.createElement('div');
        const heading = document.createElement('strong');
        const content = document.createElement('span');
        heading.textContent = label;
        content.textContent = value || '—';
        if (className) content.className = className;
        item.append(heading, content);
        details.append(item);
      }

      function requestCard(request) {
        const agent = request.agent || {};
        const pickup = isPickupRequest(request);
        const card = document.createElement('article');
        card.className = 'card';
        const top = document.createElement('div'); top.className = 'request-top';
        const titleBlock = document.createElement('div');
        const title = document.createElement('h3'); title.textContent = requestName(request);
        const created = document.createElement('p'); created.className = 'muted'; created.textContent = `${!pickup && request.status === 'Approved' ? 'Approved' : 'Submitted'} ${formatDate(reportDateFor(request))}`;
        titleBlock.append(title, created);
        const badge = document.createElement('span'); badge.className = `badge${request.status === 'Approved' ? ' approved' : request.status === 'Rejected' ? ' rejected' : ''}`; badge.textContent = request.status || 'Pending approval';
        top.append(titleBlock, badge);
        const details = document.createElement('div'); details.className = 'details';
        if (pickup) {
          addRequestDetail(details, 'Employee / agent', agent.fullName || request.agentEmail || '—');
          addRequestDetail(details, 'Goods and number', (request.goods || []).map((good) => `${good.name}: ${good.quantity}`).join(', ') || '—');
          addRequestDetail(details, 'Requested pickup date', formatPickupDate(request.preferredDate || request.preferredTime));
          addRequestDetail(details, 'Location / notes', [request.location, request.notes].filter(Boolean).join(' · ') || '—');
        } else {
          addRequestDetail(details, 'Ticket ID', request.id);
          addRequestDetail(details, 'Ticket type', requestName(request));
          addRequestDetail(details, 'Employee / agent', agent.fullName || request.agentEmail || '—');
          addRequestDetail(details, 'Email', request.agentEmail || agent.email || '—');
          addRequestDetail(details, 'Phone', agent.phone || '—');
          addRequestDetail(details, 'Company / location', [agent.company, agent.location].filter(Boolean).join(' · ') || '—');
          addRequestDetail(details, 'Goods, quantity, unit price and line total', (request.goods || []).map((good) => {
            const quantity = Number(good.quantity) || 0;
            const unitPrice = Number(good.amount) || 0;
            const lineTotal = Number.isFinite(Number(good.totalAmount)) ? Number(good.totalAmount) : quantity * unitPrice;
            return `${good.name || 'Unnamed good'}: ${quantity} × KSh ${formatAmount(unitPrice)} = KSh ${formatAmount(lineTotal)}`;
          }).join(' | ') || '—');
          addRequestDetail(details, 'Combined total amount', `KSh ${formatAmount(requestTotal(request))}`, 'request-total');
          addRequestDetail(details, 'Notes', request.notes || '—');
          addRequestDetail(details, 'Submitted / updated', [request.createdAt ? formatDate(request.createdAt) : '', request.updatedAt ? `Updated ${formatDate(request.updatedAt)}` : '', request.resubmittedAt ? `Resubmitted ${formatDate(request.resubmittedAt)}` : ''].filter(Boolean).join(' · ') || '—');
          if (request.approvedAt) addRequestDetail(details, 'Approved', formatDate(request.approvedAt));
          if (request.status === 'Rejected') {
            addRequestDetail(details, 'Rejected', request.rejectedAt ? formatDate(request.rejectedAt) : '—');
            addRequestDetail(details, 'Rejection reason', request.rejectionReason || 'No reason provided');
          }
          if (request.revisionCount) addRequestDetail(details, 'Previous versions retained', `${request.revisionCount}`);
        }
        const actions = document.createElement('div'); actions.className = 'actions';

        if (canApprove && request.status === 'Pending approval') {
          const approve = document.createElement('button');
          approve.className = 'btn';
          approve.type = 'button';
          approve.textContent = `Approve ${requestName(request).toLowerCase()}`;
          approve.addEventListener('click', async () => {
            approve.disabled = true;
            const response = await fetch(`/api/admin/pickup-requests/${encodeURIComponent(request.id)}/approve`, { method: 'POST' });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              alert(result.error || 'Unable to approve this request.');
              approve.disabled = false;
              return;
            }
            load();
          });
          actions.append(approve);
        }

        if (canApprove && !pickup && request.status === 'Pending approval') {
          const reject = document.createElement('button');
          reject.className = 'btn danger';
          reject.type = 'button';
          reject.textContent = 'Reject ticket';
          reject.addEventListener('click', async () => {
            const reason = prompt('Optional rejection reason for the ticket owner:');
            if (reason === null) return;
            reject.disabled = true;
            const response = await fetch(`/api/admin/pickup-requests/${encodeURIComponent(request.id)}/reject`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reason })
            });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              alert(result.error || 'Unable to reject this ticket.');
              reject.disabled = false;
              return;
            }
            load();
          });
          actions.append(reject);
        }
        if (!pickup && ['Approved', 'Rejected'].includes(request.status)) {
          const remove = document.createElement('button');
          remove.className = 'btn danger';
          remove.type = 'button';
          remove.textContent = 'Delete ticket';
          remove.addEventListener('click', async () => {
            const reason = prompt('Reason for deleting this ticket:');
            if (reason === null) return;
            if (!reason.trim()) { alert('A deletion reason is required.'); return; }
            if (!confirm('Delete this finalized ticket and its revision history? This cannot be undone.')) return;
            remove.disabled = true;
            try {
              const response = await fetch(`/api/admin/pickup-requests/${encodeURIComponent(request.id)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }) });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(result.error || 'Unable to delete this ticket.');
              load();
            } catch (error) {
              alert(error.message || 'Unable to delete this ticket.');
              remove.disabled = false;
            }
          });
          actions.append(remove);
        }
        if (!pickup && request.revisionCount) {
          const revisions = document.createElement('button');
          revisions.className = 'btn ghost';
          revisions.type = 'button';
          revisions.textContent = 'View revision history';
          revisions.addEventListener('click', async () => {
            revisions.disabled = true;
            try {
              const response = await fetch(`/api/admin/pickup-requests/${encodeURIComponent(request.id)}/revisions`);
              const result = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(result.error || 'Unable to load revision history.');
              const history = (result.revisions || []).map((revision) => `Version ${revision.version}: ${revision.status}${revision.rejectionReason ? ` — ${revision.rejectionReason}` : ''}`).join('\n');
              alert(history || 'No previous versions found.');
            } catch (error) { alert(error.message || 'Unable to load revision history.'); }
            finally { revisions.disabled = false; }
          });
          actions.append(revisions);
        }

        card.append(top, details, actions);
        return card;
      }

      function listRequests(container, items, emptyMessage) {
        if (!items.length) {
          showEmpty(container, emptyMessage);
          return;
        }
        container.replaceChildren(...items.map(requestCard));
      }

      function renderSummary(items) {
        const target = $('#summary');
        const people = new Map();
        items.forEach((request) => {
          const agent = request.agent || {};
          const id = request.agentEmail || agent.email || 'unknown';
          const person = people.get(id) || { name: agent.fullName || id, role: roleName(request), goods: new Map(), ticketCount: 0, total: 0 };
          (request.goods || []).forEach((good) => person.goods.set(good.name, (person.goods.get(good.name) || 0) + (Number(good.quantity) || 0)));
          person.ticketCount += 1;
          person.total += requestTotal(request);
          people.set(id, person);
        });
        if (!people.size) {
          showEmpty(target, 'No goods were recorded for this selection.');
          return;
        }
        const table = document.createElement('table');
        table.className = 'summary';
        table.innerHTML = '<thead><tr><th>Employee / agent</th><th>Role</th><th>Tickets</th><th>Aggregated goods across selected tickets</th><th>Total across tickets</th></tr></thead>';
        const body = document.createElement('tbody');
        people.forEach((person) => {
          const row = document.createElement('tr');
          [person.name, person.role, person.ticketCount, [...person.goods].map(([name, quantity]) => `${name}: ${quantity}`).join(', '), formatAmount(person.total)].forEach((value, index) => {
            const cell = document.createElement('td');
            if (index === 0) cell.className = 'summary-person';
            if (index === 2) cell.className = 'summary-count';
            if (index === 4) cell.className = 'summary-total';
            cell.textContent = value;
            row.append(cell);
          });
          body.append(row);
        });
        table.append(body);
        const wrap = document.createElement('div');
        wrap.className = 'summary-wrap';
        wrap.append(table);
        target.replaceChildren(wrap);
      }

      function renderDateApprovals() {
        root.innerHTML = '<p class="muted date-approval-intro">These are pickup-date approval requests. They are separate from pickup tickets, so each decision is recorded against the exact requested date.</p><section class="filters"><label>Status <select id="dateApprovalStatus"><option value="Pending approval">Pending approval</option><option value="all">All statuses</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option></select></label><label>From <input id="dateApprovalFrom" type="date" /></label><label>To <input id="dateApprovalTo" type="date" /></label></section><div id="dateApprovals"></div>';
        const statusSelect = $('#dateApprovalStatus');
        const fromInput = $('#dateApprovalFrom');
        const toInput = $('#dateApprovalTo');
        const target = $('#dateApprovals');
        const draw = () => {
          const selected = pickupDateRequests.filter((request) => (statusSelect.value === 'all' || request.status === statusSelect.value) && isWithinDateRange(request, fromInput.value, toInput.value));
          if (!selected.length) {
            showEmpty(target, statusSelect.value === 'Pending approval' ? 'No pickup-date requests are waiting for approval.' : 'No pickup-date requests match this filter.');
            return;
          }
          const wrap = document.createElement('div');
          wrap.className = 'date-approval-wrap';
          const table = document.createElement('table');
          table.className = 'date-approval-table';
          const head = document.createElement('thead');
          const headingRow = document.createElement('tr');
          ['Employee / agent', 'Requested pickup date', 'Submitted', 'Goods since last pickup', 'Status', 'Decision'].forEach((label) => {
            const cell = document.createElement('th');
            cell.textContent = label;
            headingRow.append(cell);
          });
          head.append(headingRow);
          const body = document.createElement('tbody');
          selected.forEach((request) => {
            const row = document.createElement('tr');
            const agent = request.agent || {};
            const person = document.createElement('td');
            person.className = 'person';
            person.textContent = agent.fullName || request.agentEmail || 'Unknown account';
            const date = document.createElement('td');
            date.textContent = formatPickupDate(request.requestedDate);
            const submitted = document.createElement('td');
            submitted.textContent = request.createdAt ? formatDate(request.createdAt) : '—';
            const goods = document.createElement('td');
            goods.textContent = `${Number(request.totalQuantitySinceLastPickup || 0).toLocaleString('en-KE')} items · KSh ${formatAmount(request.totalAmountSinceLastPickup)}`;
            const status = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = `badge${request.status === 'Approved' ? ' approved' : request.status === 'Rejected' ? ' rejected' : ''}`;
            badge.textContent = request.status || 'Pending approval';
            status.append(badge);
            const decision = document.createElement('td');
            if (canApprove && request.status === 'Pending approval') {
              const actions = document.createElement('div');
              actions.className = 'approval-actions';
              const decide = async (action, reason = '') => {
                const response = await fetch(`/api/admin/pickup-date-requests/${encodeURIComponent(request.id)}/${action}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: action === 'reject' ? JSON.stringify({ reason }) : undefined
                });
                if (!response.ok) {
                  const result = await response.json().catch(() => ({}));
                  throw new Error(result.error || `Unable to ${action} this pickup date.`);
                }
                load();
              };
              const approve = document.createElement('button');
              approve.className = 'btn'; approve.type = 'button'; approve.textContent = 'Approve date';
              approve.addEventListener('click', async () => { approve.disabled = true; try { await decide('approve'); } catch (error) { alert(error.message || 'Unable to approve this pickup date.'); approve.disabled = false; } });
              const reject = document.createElement('button');
              reject.className = 'btn danger'; reject.type = 'button'; reject.textContent = 'Reject date';
              reject.addEventListener('click', async () => { const reason = prompt('Optional rejection reason for the agent:'); if (reason === null) return; reject.disabled = true; try { await decide('reject', reason); } catch (error) { alert(error.message || 'Unable to reject this pickup date.'); reject.disabled = false; } });
              actions.append(approve, reject);
              decision.append(actions);
            } else {
              const reviewer = request.reviewedBy ? `Reviewed by ${request.reviewedBy}` : 'View only';
              const reviewedAt = request.reviewedAt ? ` · ${formatDate(request.reviewedAt)}` : '';
              decision.textContent = `${reviewer}${reviewedAt}${request.rejectionReason ? ` · ${request.rejectionReason}` : ''}`;
            }
            row.append(person, date, submitted, goods, status, decision);
            body.append(row);
          });
          table.append(head, body);
          wrap.append(table);
          target.replaceChildren(wrap);
        };
        statusSelect.addEventListener('change', draw);
        fromInput.addEventListener('change', draw);
        toInput.addEventListener('change', draw);
        draw();
      }

      function renderFiltersAndRequests() {
        root.innerHTML = '<section class="filters"><label>Person <select id="person"><option value="">All employees and agents</option></select></label><label>Status <select id="status"><option value="all">All statuses</option><option value="Pending approval">Pending approval</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option></select></label><label>From <input id="requestFrom" type="date" /></label><label>To <input id="requestTo" type="date" /></label></section>' + (viewName === 'overview' ? '<h2>Aggregate ticket summary</h2><p class="muted">This table combines all tickets matching the filters for each person. It is not an individual-order view; use the ticket list to inspect a specific ticket and its ID.</p><div id="summary"></div><h2>Unapproved agent tickets</h2><div id="agents"></div><h2>Unapproved field employee tickets</h2><div id="fields"></div>' : '<p class="muted">All agent and field employee tickets are shown. Use the filters to narrow the list.</p><div id="results"></div>');
        const personSelect = $('#person');
        accounts.forEach((account) => personSelect.add(new Option(`${account.fullName} — ${account.role === 'fieldEmployee' ? 'Field employee' : 'Agent'}`, account.email)));
        const statusSelect = $('#status');
        const fromInput = $('#requestFrom');
        const toInput = $('#requestTo');
        const draw = () => {
          let selected = requests.filter((request) => (!personSelect.value || request.agentEmail === personSelect.value) && (statusSelect.value === 'all' || request.status === statusSelect.value) && isWithinDateRange(request, fromInput.value, toInput.value));
          if (viewName === 'overview') {
            const tickets = selected.filter((request) => !isPickupRequest(request));
            renderSummary(tickets);
            const pendingTickets = tickets.filter((request) => request.status !== 'Approved');
            listRequests($('#agents'), pendingTickets.filter(isAgentTicket), 'No unapproved agent tickets match these filters.');
            listRequests($('#fields'), pendingTickets.filter(isField), 'No unapproved field employee tickets match these filters.');
          } else {
            listRequests($('#results'), selected, 'No requests match these filters.');
          }
        };
        personSelect.addEventListener('change', draw);
        statusSelect.addEventListener('change', draw);
        fromInput.addEventListener('change', draw);
        toInput.addEventListener('change', draw);
        draw();
      }

      function renderAccounts() {
        root.innerHTML = '<p class="muted">Create and manage agent, field employee and accountant accounts. Deleting an account permanently removes its login access; existing request records are retained.</p><section class="card"><h2>Create accountant account</h2><form id="createAccountant"><div class="filters"><label>Full name <input name="fullName" required maxlength="160" /></label><label>Email <input name="email" type="email" required /></label><label>Temporary password <input name="password" type="password" minlength="8" required /></label><button class="btn" type="submit">Create accountant</button></div><p class="muted" id="accountantCreateStatus"></p></form></section><section><h2>Accountant registration requests</h2><div id="accountantApplications"></div></section><section><h2>Accounts</h2><div id="accounts"></div></section>';
        document.getElementById('createAccountant').addEventListener('submit', async (event) => {
          event.preventDefault(); const form = event.currentTarget; const status = $('#accountantCreateStatus'); const button = form.querySelector('button'); button.disabled = true; status.textContent = 'Creating accountant account…';
          try { const response = await fetch('/api/admin/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...Object.fromEntries(new FormData(form).entries()), role: 'accountant' }) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.error || 'Unable to create accountant account.'); form.reset(); status.textContent = 'Accountant account created.'; load(); }
          catch (error) { status.textContent = error.message || 'Unable to create accountant account.'; }
          finally { button.disabled = false; }
        });
        const registrationTarget = $('#accountantApplications');
        const pendingRegistrations = accountantApplications.filter((application) => application.status === 'Pending');
        if (!pendingRegistrations.length) {
          showEmpty(registrationTarget, 'No accountant registrations are waiting for review.');
        } else {
          pendingRegistrations.forEach((application) => {
            const card = document.createElement('article');
            card.className = 'card account';
            const details = document.createElement('div');
            const name = document.createElement('strong');
            const meta = document.createElement('div');
            name.textContent = application.fullName;
            meta.className = 'muted';
            meta.textContent = `${application.email} · Registered ${formatDate(application.createdAt)}`;
            details.append(name, meta);
            const actions = document.createElement('div');
            actions.className = 'approval-actions';
            const review = async (action) => {
              const response = await fetch(`/api/admin/accountant-applications/${encodeURIComponent(application.id)}/${action}`, { method: 'POST' });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(result.error || `Unable to ${action} this registration.`);
              load();
            };
            const approve = document.createElement('button');
            approve.className = 'btn'; approve.type = 'button'; approve.textContent = 'Approve registration';
            approve.addEventListener('click', async () => { if (!confirm(`Approve ${application.fullName}'s accountant registration?`)) return; approve.disabled = true; try { await review('approve'); } catch (error) { alert(error.message || 'Unable to approve this registration.'); approve.disabled = false; } });
            const reject = document.createElement('button');
            reject.className = 'btn danger'; reject.type = 'button'; reject.textContent = 'Reject';
            reject.addEventListener('click', async () => { if (!confirm(`Reject ${application.fullName}'s accountant registration?`)) return; reject.disabled = true; try { await review('reject'); } catch (error) { alert(error.message || 'Unable to reject this registration.'); reject.disabled = false; } });
            actions.append(approve, reject);
            card.append(details, actions);
            registrationTarget.append(card);
          });
        }
        const target = $('#accounts');
        if (!accounts.length) {
          showEmpty(target, 'No accounts have been created yet.');
          return;
        }
        accounts.forEach((account) => {
          const card = document.createElement('article');
          card.className = 'card account';
          const details = document.createElement('div');
          const actions = document.createElement('div');
          actions.className = 'account-actions';
          const name = document.createElement('strong');
          const meta = document.createElement('div');
          name.textContent = account.fullName;
          meta.className = 'muted';
          const role = account.role === 'fieldEmployee' ? 'Field employee' : account.role === 'accountant' ? 'Accountant' : 'Agent';
          meta.textContent = `${role} · ${account.email}${account.accessStatus === 'disabled' ? ' · Disabled' : ''}`;
          details.append(name, meta);
          const access = document.createElement('button');
          const disabled = account.accessStatus === 'disabled';
          access.className = `btn${disabled ? '' : ' danger'}`;
          access.classList.add('account-access');
          access.type = 'button';
          access.textContent = disabled ? 'Enable account' : 'Disable account';
          access.addEventListener('click', async () => {
            const action = disabled ? 'enable' : 'disable';
            if (!confirm(`${disabled ? 'Enable' : 'Disable'} ${account.fullName}'s account?${disabled ? '' : ' Their active sessions and recovery links will be revoked.'}`)) return;
            const response = await fetch(`/api/admin/accounts/${encodeURIComponent(account.email)}/${action}`, { method: 'POST' });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              alert(result.error || `Unable to ${action} this account.`);
              return;
            }
            load();
          });
          const upgrade = account.role === 'fieldEmployee' ? document.createElement('button') : null;
          if (upgrade) {
            upgrade.className = 'btn';
            upgrade.classList.add('account-upgrade');
            upgrade.type = 'button';
            upgrade.textContent = 'Upgrade to agent';
            upgrade.addEventListener('click', async () => {
              if (!confirm(`Upgrade ${account.fullName} to an Agent? Their field employee sessions will be revoked and they will receive an email to set an Agent password.`)) return;
              upgrade.disabled = true;
              const response = await fetch(`/api/admin/accounts/${encodeURIComponent(account.email)}/upgrade-to-agent`, { method: 'POST' });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) {
                alert(result.error || 'Unable to upgrade this account.');
                upgrade.disabled = false;
                return;
              }
              alert(result.message || 'Account upgraded to agent.');
              load();
            });
          }
          const resendAgentAccess = account.role === 'agent' && account.accessStatus === 'invited' && account.upgradedAt ? document.createElement('button') : null;
          if (resendAgentAccess) {
            resendAgentAccess.className = 'btn btn-ghost';
            resendAgentAccess.classList.add('account-upgrade');
            resendAgentAccess.type = 'button';
            resendAgentAccess.textContent = 'Resend agent access';
            resendAgentAccess.addEventListener('click', async () => {
              resendAgentAccess.disabled = true;
              const response = await fetch(`/api/admin/accounts/${encodeURIComponent(account.email)}/resend-agent-access`, { method: 'POST' });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) {
                alert(result.error || 'Unable to resend Agent access.');
                resendAgentAccess.disabled = false;
                return;
              }
              alert(result.message || 'A new Agent account-access link has been emailed.');
            });
          }
          const remove = document.createElement('button');
          remove.className = 'btn danger';
          remove.classList.add('account-delete');
          remove.type = 'button';
          remove.textContent = 'Delete account';
          remove.addEventListener('click', async () => {
            const reason = prompt(`Why are you deleting ${account.fullName}'s account?`);
            if (reason === null) return;
            if (!reason.trim()) {
              alert('A deletion reason is required.');
              return;
            }
            if (!confirm(`Delete ${account.fullName}'s login account? Their tickets, pickup records and audit history will be kept. They can register again with this email.`)) return;
            const response = await fetch(`/api/admin/accounts/${encodeURIComponent(account.email)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: reason.trim() }) });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
              alert(result.error || 'Unable to delete this account.');
              return;
            }
            if (result.message) alert(result.message);
            load();
          });
          actions.append(access);
          if (upgrade) actions.append(upgrade);
          if (resendAgentAccess) actions.append(resendAgentAccess);
          actions.append(remove);
          card.append(details, actions);
          target.append(card);
        });
      }

      async function reviewApplication(application, action) {
        const actionLabels = { approve: 'approve', reject: 'reject', 'resend-access': 'resend the access link for' };
        if (action === 'reject' && !confirm(`Reject ${application.fullName}'s application? They will receive a polite regional-recruitment email.`)) return;
        if (action === 'approve' && !confirm(`Approve ${application.fullName}? They will receive a secure account-access email.`)) return;
        try {
          const response = await fetch(`/api/admin/agent-applications/${encodeURIComponent(application.id)}/${action}`, { method: 'POST' });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `Unable to ${actionLabels[action]} this application.`);
          if (result.message) alert(result.message);
          load();
        } catch (error) {
          alert(error.message || `Unable to ${actionLabels[action]} this application.`);
        }
      }

      function renderApplications() {
        root.innerHTML = '<p class="muted">Review prospective agents before they receive access to the Agent portal.</p><section class="filters"><label>Status <select id="applicationStatus"><option value="Pending">Pending review</option><option value="all">All applications</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option></select></label></section><div id="applications"></div>';
        const statusSelect = $('#applicationStatus');
        const target = $('#applications');
        const draw = () => {
          const selected = applications.filter((application) => statusSelect.value === 'all' || application.status === statusSelect.value);
          if (!selected.length) {
            showEmpty(target, statusSelect.value === 'Pending' ? 'No agent applications are waiting for review.' : 'No agent applications match this filter.');
            return;
          }
          const cards = selected.map((application) => {
            const card = document.createElement('article');
            card.className = 'card';
            const top = document.createElement('div');
            top.className = 'request-top';
            const heading = document.createElement('div');
            const name = document.createElement('h3');
            name.textContent = application.fullName || 'Unnamed applicant';
            const submitted = document.createElement('p');
            submitted.className = 'muted';
            submitted.textContent = `Submitted ${formatDate(application.createdAt)}`;
            heading.append(name, submitted);
            const badge = document.createElement('span');
            badge.className = `badge${application.status === 'Approved' ? ' approved' : application.status === 'Rejected' ? ' rejected' : ''}`;
            badge.textContent = application.status || 'Pending';
            top.append(heading, badge);
            const details = document.createElement('div');
            details.className = 'details';
            [
              ['Email', application.email],
              ['Phone number', application.phone],
              ['Business name', application.businessName],
              ['Location', application.location],
              ['Applicant email', application.status === 'Approved' ? (application.accessActivatedAt ? 'Access activated' : application.accessEmailStatus || 'Pending') : application.status === 'Rejected' ? (application.rejectionEmailStatus || 'Pending') : 'Not sent yet']
            ].forEach(([label, value]) => {
              const item = document.createElement('div');
              const strong = document.createElement('strong');
              const text = document.createElement('span');
              strong.textContent = label;
              text.textContent = value || '—';
              item.append(strong, text);
              details.append(item);
            });
            const actions = document.createElement('div');
            actions.className = 'actions';
            if (application.status === 'Pending') {
              const approve = document.createElement('button');
              approve.className = 'btn';
              approve.type = 'button';
              approve.textContent = 'Approve & send access';
              approve.addEventListener('click', () => reviewApplication(application, 'approve'));
              const reject = document.createElement('button');
              reject.className = 'btn danger';
              reject.type = 'button';
              reject.textContent = 'Reject';
              reject.addEventListener('click', () => reviewApplication(application, 'reject'));
              actions.append(approve, reject);
            } else if (application.status === 'Approved' && !application.accessActivatedAt) {
              const resend = document.createElement('button');
              resend.className = 'btn ghost';
              resend.type = 'button';
              resend.textContent = 'Resend access link';
              resend.addEventListener('click', () => reviewApplication(application, 'resend-access'));
              actions.append(resend);
            }
            card.append(top, details, actions);
            return card;
          });
          target.replaceChildren(...cards);
        };
        statusSelect.addEventListener('change', draw);
        draw();
      }

      async function load() {
        root.replaceChildren();
        const sessionResponse = await fetch(portalRole === 'accountant' ? '/api/accountant-session' : '/api/admin-session').catch(() => null);
        if (!sessionResponse?.ok) {
          const alternateSession = await fetch(portalRole === 'accountant' ? '/api/admin-session' : '/api/accountant-session').catch(() => null);
          if (alternateSession?.ok) return location.replace(portalRole === 'accountant' ? 'admin-dashboard.html' : 'admin-dashboard.html?role=accountant');
          return location.assign(portalRole === 'accountant' ? 'accountant-login.html' : 'admin-login.html');
        }
        const results = await Promise.allSettled([
          fetch('/api/admin/pickup-requests'),
          fetch('/api/admin/pickup-date-requests'),
          portalRole === 'admin' ? fetch('/api/admin/accounts') : Promise.resolve(null),
          portalRole === 'admin' ? fetch('/api/admin/agent-applications') : Promise.resolve(null),
          portalRole === 'admin' ? fetch('/api/admin/accountant-applications') : Promise.resolve(null)
        ]);
        const responses = results.filter((result) => result.status === 'fulfilled' && result.value).map((result) => result.value);
        if (responses.some((response) => response.status === 401)) return location.assign(portalRole === 'accountant' ? 'accountant-login.html' : 'admin-login.html');
        const read = async (result, label) => {
          if (result.status === 'rejected' || !result.value) throw new Error(`Unable to load ${label}.`);
          const data = await result.value.json().catch(() => ({}));
          if (!result.value.ok) throw new Error(data.error || `Unable to load ${label}.`);
          return data;
        };
        try {
          const requestData = await read(results[0], 'pickup requests');
          requests = requestData.requests || [];
          const pickupDateData = await read(results[1], 'pickup-date requests');
          pickupDateRequests = pickupDateData.requests || [];
        } catch (error) {
          return showEmpty(root, error.message || 'Unable to load dashboard requests.');
        }
        try { accounts = (await read(results[2], 'accounts')).accounts || []; } catch { accounts = []; }
        try { applications = (await read(results[3], 'agent applications')).applications || []; } catch (error) {
          if (viewName === 'applications') return showEmpty(root, error.message || 'Unable to load agent applications.');
        }
        try { accountantApplications = (await read(results[4], 'accountant registrations')).applications || []; } catch { accountantApplications = []; }
        if (viewName === 'approved-pickups') requests = requests.filter((request) => isPickupRequest(request) && request.status === 'Approved');
        if (viewName === 'approved-agents') requests = requests.filter((request) => isAgentTicket(request) && request.status === 'Approved');
        if (viewName === 'approved-fields') requests = requests.filter((request) => !isPickupRequest(request));
        if (viewName === 'accounts') renderAccounts();
        else if (viewName === 'applications') renderApplications();
        else if (viewName === 'pickup-dates') renderDateApprovals();
        else renderFiltersAndRequests();
      }

      $('#refresh').addEventListener('click', load);
      $('#logout').addEventListener('click', async () => {
        await fetch(portalRole === 'accountant' ? '/api/accountant-logout' : '/api/admin-logout', { method: 'POST' });
        location.assign(portalRole === 'accountant' ? 'accountant-login.html' : 'admin-login.html');
      });
      load();
    </script>
    <script src="accountant-language.js"></script>
  </body>
