<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#082a62" />
    <title>Collective view | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#f4f7fb; color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
      .shell { width:min(100% - 32px,1040px); margin:0 auto; padding:18px 0 56px; }.topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; }.brand img { width:148px; height:54px; object-fit:contain; object-position:left center; }.back { min-height:42px; padding:10px 15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--blue-deep); font:750 14px inherit; cursor:pointer; }.back:hover { background:#eef7ff; }.hero { margin:28px 0 22px; }.eyebrow { margin:0 0 6px; color:var(--orange); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; } h1,h2 { margin:0; color:var(--blue-deep); } h1 { font-size:clamp(32px,6vw,50px); letter-spacing:-1.6px; }.muted { margin:8px 0 0; color:var(--muted); }.card { padding:clamp(20px,4vw,32px); border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 14px 34px rgba(20,83,136,.09); }.summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:20px 0; }.metric { padding:16px; border:1px solid var(--line); border-radius:13px; background:#f8fcff; }.metric span { display:block; color:var(--muted); font-size:13px; }.metric strong { display:block; margin-top:4px; color:var(--blue-deep); font-size:25px; }.table-wrap { overflow-x:auto; } table { width:100%; min-width:520px; border-collapse:collapse; } th,td { padding:13px 10px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; } td:last-child { color:var(--blue-deep); font-weight:800; }.empty { padding:20px; border:1px solid var(--line); border-radius:12px; color:var(--muted); text-align:center; } @media(max-width:650px) { .shell { width:min(100% - 24px,1040px); }.topbar { align-items:flex-start; }.brand img { width:132px; height:42px; }.summary { grid-template-columns:1fr; }.back { min-height:38px; padding:8px 11px; font-size:12px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar"><a class="brand" id="dashboardLink" href="agent-dashboard.html"><img src="images/company-logo.png" alt="Aihuishou Electricals" /></a><button class="back" id="backButton" type="button">← Back to dashboard</button></header>
      <section class="hero"><p class="eyebrow" id="roleLabel">Agent performance</p><h1>Collective view</h1><p class="muted" id="period">Loading this month’s recorded totals…</p></section>
      <section class="card"><div class="summary"><article class="metric"><span>Total quantity</span><strong id="totalQuantity">0</strong></article><article class="metric"><span>Total amount</span><strong id="totalAmount">KSh 0.00</strong></article></div><div class="table-wrap" id="goodsTable"><div class="empty">Loading current-month goods…</div></div></section>
    </main>
    <script>
      const requestedRole = new URLSearchParams(location.search).get('role');
      const role = requestedRole === 'fieldEmployee' ? 'fieldEmployee' : 'agent';
      const dashboard = role === 'fieldEmployee' ? 'field-employee-dashboard.html' : 'agent-dashboard.html';
      const login = role === 'fieldEmployee' ? 'field-employee-login.html' : 'agent-login.html';
      const sessionEndpoint = role === 'fieldEmployee' ? '/api/field-employee-session' : '/api/agent-session';
      const money = (value) => `KSh ${Number(value || 0).toLocaleString('en-KE', { minimumFractionDigits:2, maximumFractionDigits:2 })}`;
      document.getElementById('dashboardLink').href = dashboard;
      document.getElementById('roleLabel').textContent = role === 'fieldEmployee' ? 'Field employee performance' : 'Agent performance';
      document.getElementById('backButton').addEventListener('click', () => history.length > 1 ? history.back() : location.assign(dashboard));
      function render(data) { const items=data.items || []; document.getElementById('totalQuantity').textContent=Number(data.totalQuantity || 0).toLocaleString('en-KE'); document.getElementById('totalAmount').textContent=money(data.totalAmount); document.getElementById('period').textContent=data.month ? `${new Intl.DateTimeFormat('en-KE',{month:'long',year:'numeric'}).format(new Date(`${data.month}-01T00:00:00`))} recorded totals` : 'Current month'; const target=document.getElementById('goodsTable'); if(!items.length){target.innerHTML='<div class="empty">No goods have been recorded this month.</div>';return;} const table=document.createElement('table'); table.innerHTML='<thead><tr><th>Good</th><th>Collective quantity</th><th>Collective amount</th></tr></thead>'; const body=document.createElement('tbody'); items.forEach((item)=>{const row=document.createElement('tr');row.innerHTML='<td></td><td></td><td></td>';row.children[0].textContent=item.name;row.children[1].textContent=Number(item.quantity||0).toLocaleString('en-KE');row.children[2].textContent=money(item.amount);body.append(row);});table.append(body);target.replaceChildren(table); }
      async function load() { try { const session=await fetch(sessionEndpoint); if(!session.ok) return location.assign(login); const response=await fetch('/api/current-month-goods-summary'); const data=await response.json(); if(!response.ok) throw new Error(data.error || 'Unable to load current-month goods.'); render(data); } catch(error) { document.getElementById('goodsTable').innerHTML=`<div class="empty">${error.message || 'Unable to load current-month goods.'}</div>`; } }
      load();
    </script>
  </body>
</html>
