<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin access | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .admin-shell { width: min(520px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0; }
      .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 34px; }
      .portal-logo { width: 154px; height: 58px; object-fit: contain; object-position: left center; }
      .admin-card { padding: clamp(24px, 5vw, 42px); border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.88); box-shadow: 0 14px 34px rgba(20,83,136,.09); }
      .eyebrow { color: var(--orange); font: 500 11px 'DM Mono', monospace; letter-spacing: 1.4px; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; color: var(--blue-deep); font-size: clamp(30px, 7vw, 46px); letter-spacing: -2px; }
      .muted { color: var(--muted); font-size: 14px; }
      label { display: block; margin: 18px 0 6px; color: var(--blue-deep); font-size: 13px; font-weight: 700; }
      input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #f8fcff; color: var(--ink); font: inherit; }
      input:focus { outline: 0; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(35,103,255,.12); }
      .password-field { position: relative; }
      .password-field input { box-sizing: border-box; padding-right: 52px; }
      .password-toggle { position: absolute; top: 50%; right: 6px; display: grid; width: 36px; height: 36px; padding: 0; place-items: center; transform: translateY(-50%); border: 0; border-radius: 6px; background: transparent; color: var(--orange); cursor: pointer; }
      .password-toggle:hover { background: rgba(35,103,255,.08); }
      .password-toggle:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
      .password-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .password-toggle .eye-slash { display: none; }.password-toggle.is-visible .eye-slash { display: block; }
      .btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 22px; padding: 12px 17px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; font: 700 14px inherit; cursor: pointer; }
      .status { min-height: 22px; margin-top: 14px; color: var(--muted); font-size: 13px; }
      .status.error { color: #b42318; }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header"><a href="index.html"><img class="portal-logo" src="images/company-logo.png" alt="Aihuishou Electricals" /></a><a class="btn btn-ghost" href="index.html">Back</a></header>
      <section class="admin-card">
        <div class="eyebrow">Operations console</div>
        <h1>Admin sign in</h1>
        <p class="muted">Access incoming agent pickup requests.</p>
        <form id="adminLoginForm">
          <label for="adminEmail">Admin email</label>
          <input id="adminEmail" name="email" type="email" autocomplete="username" required />
          <label for="adminPassword">Admin password</label>
          <div class="password-field"><input id="adminPassword" name="password" type="password" autocomplete="current-password" required /><button class="password-toggle" type="button" aria-controls="adminPassword" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></div>
          <button class="btn" type="submit">Open request inbox</button>
          <p class="muted"><a href="password-reset.html">Forgot your password?</a></p>
          <p class="status" id="adminStatus" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      document.querySelector('.password-toggle').addEventListener('click', (event) => { const button = event.currentTarget; const input = document.getElementById(button.getAttribute('aria-controls')); const visible = input.type === 'text'; input.type = visible ? 'password' : 'text'; button.classList.toggle('is-visible', !visible); button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password'); button.setAttribute('aria-pressed', String(!visible)); });
      document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button');
        const status = document.getElementById('adminStatus');
        button.disabled = true;
        status.className = 'status';
        status.textContent = 'Signing in...';
        try {
          const response = await fetch('/api/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to sign in.');
          window.location.assign('admin-dashboard.html');
        } catch (error) {
          status.className = 'status error';
          status.textContent = error.message || 'Unable to sign in.';
        } finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
