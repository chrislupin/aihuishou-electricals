<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field employee dashboard | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: 'Space Grotesk', system-ui, sans-serif; } a { color: inherit; text-decoration: none; }
      .shell { width: min(1060px, calc(100% - 36px)); margin: 0 auto; } header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; } .brand { display: flex; align-items: center; } .portal-logo { width: 154px; height: 58px; object-fit: contain; object-position: left center; } .header-actions { display: flex; gap: 10px; align-items: center; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 16px; border: 1px solid transparent; border-radius: 8px; background: var(--orange); color: #fff; font: 700 14px inherit; cursor: pointer; } .btn-ghost { background: rgba(255,255,255,.65); color: var(--blue-deep); border-color: var(--line); }
      .dashboard { padding: 26px 0 62px; } .eyebrow { color: var(--orange); font: 500 11px 'DM Mono', monospace; letter-spacing: 1.4px; text-transform: uppercase; } h1 { margin: 8px 0 4px; color: var(--blue-deep); font-size: clamp(30px, 5vw, 45px); letter-spacing: -2px; } h2, h3 { color: var(--blue-deep); } .muted { margin: 0; color: var(--muted); font-size: 14px; }
      .form-card, .history-item, .history-empty { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.88); box-shadow: 0 14px 34px rgba(20,83,136,.09); } .form-card { margin-top: 24px; padding: clamp(22px, 4vw, 34px); } label { display: block; margin: 17px 0 6px; color: var(--blue-deep); font-size: 13px; font-weight: 700; } input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #f8fcff; color: var(--ink); font: inherit; } input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(35,103,255,.12); }
      .goods-fieldset { margin: 17px 0 0; padding: 0; border: 0; } .goods-fieldset legend { margin-bottom: 6px; color: var(--blue-deep); font-size: 13px; font-weight: 700; } .goods-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px 120px 110px 38px; gap: 10px; align-items: center; margin-bottom: 10px; } .remove-good-button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; } .remove-good-button:hover { border-color: var(--orange); color: var(--orange); } .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; } .status { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: 13px; } .status.error { color: #b42318; }
      .history-section { margin-top: 28px; } .history-list { display: grid; gap: 10px; } .history-item, .history-empty { padding: 16px; } .history-item-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; } .history-item h3 { margin: 0; font-size: 16px; } .history-item p { margin: 4px 0 0; color: var(--muted); font-size: 13px; } .history-status { padding: 5px 8px; border-radius: 999px; background: rgba(111,231,255,.35); color: var(--blue-deep); font: 500 10px 'DM Mono', monospace; white-space: nowrap; } .history-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; color: var(--muted); font-size: 12px; }
      @media (max-width: 650px) { .goods-row { grid-template-columns:1fr 1fr; } .remove-good-button { grid-column:2; } .history-item-head { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body><div class="shell"><header><a class="brand" href="index.html"><img class="portal-logo" src="images/company-logo.png" alt="Aihuishou Electricals" /></a><div class="header-actions"><a class="btn btn-ghost" href="index.html">Home</a><button class="btn btn-ghost" id="logoutButton" type="button">Log out</button></div></header>
    <main class="dashboard"><div><div class="eyebrow">Field employee portal</div><h1>Welcome, <span id="employeeName">Field employee</span></h1><p class="muted">Submit collected goods for admin approval.</p></div>
      <section class="form-card"><h2>Field collection report</h2><p class="muted">Location and processing time are not required. Add optional notes for the operations team.</p><form id="fieldReportForm"><fieldset class="goods-fieldset"><legend>Goods collected</legend><div id="goodsRows"></div><button class="btn btn-ghost" id="addGoodButton" type="button">+ Add another good</button></fieldset><label for="notes">Notes <span class="muted">(optional)</span></label><textarea id="notes" name="notes" rows="4" placeholder="Condition of goods or anything operations should know"></textarea><div class="form-actions"><button class="btn" type="submit">Submit field report</button><button class="btn btn-ghost" type="reset">Clear form</button></div><p class="status" id="status" role="status" aria-live="polite"></p></form></section>
      <section class="history-section"><h2>Report history</h2><div class="history-list" id="historyList"><div class="history-empty">Loading report history...</div></div></section>
    </main></div>
    <script>
      const form = document.getElementById('fieldReportForm'); const status = document.getElementById('status'); const goodsRows = document.getElementById('goodsRows'); const goodsOptions = ['512GB','256GB','128GB','64GB','32GB','16GB','8GB','4GB','CHINESE','TABLET','BIGSMART','IPHONE','CPU','DISPLAY CARDS','BATTERY','HARD DISK','HARD DISK BOARD','RAMS','CAMERA','LAPTOP BOARD','LAPTOP LOW GRADE','ORIGINAL PHONES','COMPUTER 1 ICE','COMPUTER 2 ICE','GREEN BOARD HIGH GRADE','RUBBISH','RUBBISH HIGH GRADE','PRINTERS','CAR BOARD'];
      function addGoodRow() { const row = document.createElement('div'); row.className = 'goods-row'; row.innerHTML = `<select name="goods" required><option value="" selected disabled>Select goods</option>${goodsOptions.map((good) => `<option>${good}</option>`).join('')}</select><input name="quantity" type="number" min="1" step="1" required placeholder="Quantity" aria-label="Quantity" /><input name="amount" type="number" min="0" step="0.01" required placeholder="Price" aria-label="Amount per good" /><input name="total" readonly placeholder="Total" aria-label="Total amount" /><button class="remove-good-button" type="button" aria-label="Remove this good">×</button>`; const updateTotal = () => row.querySelector('[name="total"]').value = ((Number(row.querySelector('[name="quantity"]').value) || 0) * (Number(row.querySelector('[name="amount"]').value) || 0)).toFixed(2); row.querySelector('[name="quantity"]').addEventListener('input', updateTotal); row.querySelector('[name="amount"]').addEventListener('input', updateTotal); row.querySelector('button').addEventListener('click', () => { if (goodsRows.children.length > 1) row.remove(); }); goodsRows.append(row); }
      addGoodRow(); document.getElementById('addGoodButton').addEventListener('click', addGoodRow); form.addEventListener('reset', () => setTimeout(() => { goodsRows.replaceChildren(); addGoodRow(); }, 0));
      function parseResponse(text) { if (!text) throw new Error('The server did not return a response.'); try { return JSON.parse(text); } catch { throw new Error('The server returned an invalid response.'); } }
      function renderHistory(requests) { const list = document.getElementById('historyList'); list.replaceChildren(); if (!requests.length) { list.append(Object.assign(document.createElement('div'), { className: 'history-empty', textContent: 'No field reports yet.' })); return; } requests.forEach((request) => { const item = document.createElement('article'); item.className = 'history-item'; const head = document.createElement('div'); head.className = 'history-item-head'; const details = document.createElement('div'); const title = document.createElement('h3'); title.textContent = (request.goods || []).map((good) => `${good.name} (${good.quantity})`).join(', '); const location = document.createElement('p'); location.textContent = 'Field employee report'; details.append(title, location); const badge = document.createElement('span'); badge.className = 'history-status'; badge.textContent = request.status; head.append(details, badge); const meta = document.createElement('div'); meta.className = 'history-meta'; meta.textContent = `${request.preferredTime} · ${new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(request.createdAt))}`; item.append(head, meta); list.append(item); }); }
      async function loadHistory() { try { const response = await fetch('/api/pickup-requests'); const result = parseResponse(await response.text()); if (!response.ok) { if (response.status === 401) return location.assign('field-employee-login.html'); throw new Error(result.error); } renderHistory(result.requests); } catch (error) { document.getElementById('historyList').replaceChildren(Object.assign(document.createElement('div'), { className: 'history-empty', textContent: error.message || 'Unable to load history.' })); } }
      fetch('/api/field-employee-session').then(async (response) => { const result = parseResponse(await response.text()); if (!response.ok || !result.employee) return location.assign('field-employee-login.html'); document.getElementById('employeeName').textContent = result.employee.fullName; loadHistory(); });
      form.addEventListener('submit', async (event) => { event.preventDefault(); const button = form.querySelector('button[type="submit"]'); button.disabled = true; status.className = 'status'; status.textContent = 'Sending field report...'; try { const data = new FormData(form); const names = data.getAll('goods'); const quantities = data.getAll('quantity'); const amounts = data.getAll('amount'); const goods = names.map((name, index) => ({ name, quantity: quantities[index], amount: amounts[index] })); const response = await fetch('/api/pickup-requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestType: 'fieldEmployee', goods, notes: data.get('notes') }) }); const result = parseResponse(await response.text()); if (!response.ok) throw new Error(result.error || 'Unable to submit report.'); status.textContent = 'Field report submitted and waiting for admin approval.'; form.reset(); loadHistory(); } catch (error) { status.className = 'status error'; status.textContent = error.message || 'Unable to submit report.'; } finally { button.disabled = false; } });
      document.getElementById('logoutButton').addEventListener('click', async () => { await fetch('/api/field-employee-logout', { method: 'POST' }); location.assign('field-employee-login.html'); });
    </script>
  </body>
</html>
