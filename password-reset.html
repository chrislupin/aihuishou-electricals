<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset password | Aihuishou Electricals</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .shell { width: min(520px, calc(100% - 36px)); margin: 60px auto; }
      .card { padding: 32px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 14px 34px rgba(20,83,136,.09); }
      h1 { color: var(--blue-deep); } label { display: block; margin: 16px 0 6px; font-weight: 700; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      .password-field { position: relative; }.password-field input { box-sizing: border-box; padding-right: 52px; }
      .password-toggle { position: absolute; top: 50%; right: 6px; display: grid; width: 36px; height: 36px; padding: 0; place-items: center; transform: translateY(-50%); border: 0; border-radius: 6px; background: transparent; color: var(--orange); cursor: pointer; }
      .password-toggle:hover { background: rgba(35,103,255,.08); }
      .password-toggle:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
      .password-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .password-toggle .eye-slash { display: none; }.password-toggle.is-visible .eye-slash { display: block; }
      .btn { margin-top: 20px; padding: 12px 17px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; font-weight: 700; cursor: pointer; }
      .status { min-height: 20px; color: var(--muted); }.error { color: #b42318; }.hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="shell"><section class="card">
      <h1>Reset password</h1>
      <p id="intro">Enter your account email and we’ll send a reset link. Check your spam folder if it does not arrive.</p>
      <form id="requestForm"><label>Email address<input name="email" type="email" autocomplete="email" required /></label><button class="btn">Send reset link</button></form>
      <form id="confirmForm" class="hidden"><label>New password</label><div class="password-field"><input id="newPassword" name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required /><button class="password-toggle" type="button" aria-controls="newPassword" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></div><button class="btn">Update password</button></form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section></main>
    <script>
      const query = new URLSearchParams(location.search), token = query.get('token'), email = query.get('email'), status = document.querySelector('#status');
      const requestForm = document.querySelector('#requestForm'), confirmForm = document.querySelector('#confirmForm');
      if (token && email) { requestForm.classList.add('hidden'); confirmForm.classList.remove('hidden'); document.querySelector('#intro').textContent = 'Choose a new password for your account.'; }
      document.querySelector('.password-toggle').addEventListener('click', (event) => { const button = event.currentTarget, input = document.getElementById(button.getAttribute('aria-controls')), visible = input.type === 'text'; input.type = visible ? 'password' : 'text'; button.classList.toggle('is-visible', !visible); button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password'); button.setAttribute('aria-pressed', String(!visible)); });
      async function submit(url, payload) { status.className = 'status'; status.textContent = 'Please wait…'; const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); const result = await response.json(); if (!response.ok) throw Error(result.error || 'Unable to continue.'); status.textContent = result.message; }
      requestForm.addEventListener('submit', async (event) => { event.preventDefault(); try { await submit('/api/password-reset/request', Object.fromEntries(new FormData(requestForm))); } catch (error) { status.className = 'status error'; status.textContent = error.message; } });
      confirmForm.addEventListener('submit', async (event) => { event.preventDefault(); try { await submit('/api/password-reset/confirm', { email, token, password: new FormData(confirmForm).get('password') }); confirmForm.classList.add('hidden'); } catch (error) { status.className = 'status error'; status.textContent = error.message; } });
    </script>
  </body>
</html>
