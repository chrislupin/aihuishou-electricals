<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Aihuishou Electricals</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;font-family:system-ui,sans-serif}.shell{width:min(520px,calc(100% - 36px));margin:60px auto}.card{padding:32px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 14px 34px rgba(20,83,136,.09)}h1{color:var(--blue-deep)}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}.btn{margin-top:20px;padding:12px 17px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}.status{min-height:20px;color:var(--muted)}.error{color:#b42318}.hidden{display:none}</style></head><body><main class="shell"><section class="card"><h1>Reset password</h1><p id="intro">Enter your account email and we’ll send a reset link.</p><form id="requestForm"><label>Email address<input name="email" type="email" autocomplete="email" required></label><button class="btn">Send reset link</button></form><form id="confirmForm" class="hidden"><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn">Update password</button></form><p class="status" id="status" role="status"></p></section></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),email=q.get('email'),status=document.querySelector('#status');const requestForm=document.querySelector('#requestForm'),confirmForm=document.querySelector('#confirmForm');if(token&&email){requestForm.classList.add('hidden');confirmForm.classList.remove('hidden');document.querySelector('#intro').textContent='Choose a new password for your account.'}async function submit(form,url,payload){status.className='status';status.textContent='Please wait…';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to continue.');status.textContent=d.message}requestForm.addEventListener('submit',async e=>{e.preventDefault();try{await submit(requestForm,'/api/password-reset/request',Object.fromEntries(new FormData(requestForm)))}catch(err){status.className='status error';status.textContent=err.message}});confirmForm.addEventListener('submit',async e=>{e.preventDefault();try{await submit(confirmForm,'/api/password-reset/confirm',{email,token,password:new FormData(confirmForm).get('password')});confirmForm.classList.add('hidden')}catch(err){status.className='status error';status.textContent=err.message}})</script></body></html>
