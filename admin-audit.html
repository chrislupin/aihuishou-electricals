<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit log | Aihuishou</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f4f7fb; color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.45; }
      .app { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; }
      .side { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 28px 18px; overflow-y: auto; background: radial-gradient(circle at 12% 8%, #2878b8 0, transparent 31%), linear-gradient(160deg, #082f57 0%, var(--blue-deep) 62%, #071f3b 100%); box-shadow: 12px 0 32px #08264718; }
      .side-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { display: block; width: fit-content; padding: 8px 10px; border: 1px solid #ffffff1f; border-radius: 12px; background: #ffffff0b; }
      .side img { display: block; width: 150px; height: 48px; object-fit: contain; object-position: left center; }
      .nav-toggle { display: none; }
      .nav-label { margin: 31px 10px 9px; color: #a9cce8; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      .nav { display: flex; flex: 1; flex-direction: column; gap: 6px; }
      .nav a { display: flex; align-items: center; min-height: 44px; padding: 11px 13px 11px 17px; border: 1px solid transparent; border-radius: 10px; color: #dcecff; text-decoration: none; font-size: 14px; font-weight: 700; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
      .nav a::before { width: 5px; height: 5px; margin-right: 10px; border-radius: 50%; background: #8dc7ef; content: ''; opacity: .72; }
      .nav a.active { border-color: #ffffff25; background: linear-gradient(90deg, #ffffff2c, #ffffff13); color: #fff; box-shadow: 0 8px 18px #031b351c; }
      .nav a.active::before { background: var(--orange); box-shadow: 0 0 0 4px #ff9b4926; opacity: 1; }
      .nav a:hover { border-color: #ffffff20; background: #ffffff14; color: #fff; transform: translateX(2px); }
      .nav a:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid #f7ad67; outline-offset: 3px; }
      .nav-footer { margin-top: auto; padding-top: 17px; border-top: 1px solid #ffffff20; }
      .side-logout { display: flex; align-items: center; width: 100%; min-height: 43px; gap: 9px; padding: 10px 13px; border: 1px solid #ffffff28; border-radius: 10px; background: #ffffff0d; color: #e6f2fc; font: 700 13px inherit; cursor: pointer; transition: background .16s ease, border-color .16s ease; }
      .side-logout::before { content: '↪'; color: #f7ad67; font-size: 18px; line-height: 1; }
      .side-logout:hover { border-color: #ffffff4b; background: #ffffff1c; }
      .side-logout:focus-visible { outline: 3px solid #f7ad67; outline-offset: 3px; }
      .page { width: min(1240px, calc(100% - 64px)); margin: 0 auto; padding: 42px 0 72px; }
      .header, .toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
      .eyebrow { margin: 0 0 6px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; color: var(--blue-deep); font-size: clamp(32px, 5vw, 46px); letter-spacing: -1.8px; }
      .muted, .count { color: var(--muted); }
      .toolbar { align-items: end; margin: 26px 0 14px; }
      .filter { display: grid; gap: 6px; min-width: min(100%, 370px); }
      .filter label { color: var(--blue-deep); font-size: 12px; font-weight: 800; }
      input, .btn { min-height: 42px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
      input { background: #f8fcff; color: var(--ink); }
      .btn { background: #fff; color: var(--blue-deep); cursor: pointer; font-weight: 700; }
      .btn:hover { border-color: var(--orange); box-shadow: 0 7px 15px #14538814; transform: translateY(-1px); }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 10px 24px #14538812; }
      table { width: 100%; min-width: 950px; border-collapse: collapse; }
      th, td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
      th { background: #f4faff; color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
      td { color: var(--ink); font-size: 13px; }
      tbody tr:hover { background: #f8fcff; }
      .detail { display: grid; gap: 4px; min-width: 220px; }
      .detail b { color: var(--blue-deep); }
      .empty { padding: 22px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
      @media (max-width: 900px) { .app { grid-template-columns: 224px minmax(0, 1fr); } .page { width: min(100% - 42px, 1240px); } }
      @media (max-width: 760px) { .app { display: block; } .side { position: static; display: block; height: auto; padding: 12px 14px 13px; overflow: visible; } .brand { padding: 2px 7px; border: 0; background: transparent; } .side img { width: 132px; height: 38px; } .nav-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 12px; border: 1px solid #ffffff33; border-radius: 10px; background: #ffffff12; color: #fff; font: 800 12px inherit; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; } .nav-toggle-icon, .nav-toggle-icon::before, .nav-toggle-icon::after { display: block; width: 18px; height: 2px; border-radius: 2px; background: currentColor; content: ''; transition: transform .18s ease, opacity .18s ease; } .nav-toggle-icon { position: relative; } .nav-toggle-icon::before { position: absolute; top: -6px; } .nav-toggle-icon::after { position: absolute; top: 6px; } .nav-toggle[aria-expanded="true"] .nav-toggle-icon { background: transparent; } .nav-toggle[aria-expanded="true"] .nav-toggle-icon::before { top: 0; transform: rotate(45deg); } .nav-toggle[aria-expanded="true"] .nav-toggle-icon::after { top: 0; transform: rotate(-45deg); } .nav-label { display: none; } .nav { display: none; margin-top: 12px; padding: 10px; border: 1px solid #ffffff1c; border-radius: 14px; background: #041f3bc9; box-shadow: 0 14px 28px #031b3538; } .nav.is-open { display: flex; animation: reveal-menu .18s ease-out; } .nav-footer { margin-top: 8px; padding-top: 10px; } .nav a { min-height: 44px; padding: 11px 12px; font-size: 14px; } .nav a:hover { transform: none; } .page { width: min(100% - 28px, 1240px); padding: 28px 0 52px; } } @keyframes reveal-menu { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <div class="side-top"><a class="brand" href="admin-dashboard.html"><img src="images/company-logo.png" alt="Aihuishou Electricals" /></a><button class="nav-toggle" id="navToggle" type="button" aria-controls="operationsNav" aria-expanded="false"><span class="nav-toggle-icon" aria-hidden="true"></span><span>Menu</span></button></div>
        <p class="nav-label">Operations workspace</p>
        <nav class="nav" id="operationsNav" aria-label="Operations navigation">
          <a href="admin-dashboard.html">Overview &amp; unapproved</a>
          <a href="admin-dashboard.html?view=applications">Agent applications</a>
          <a href="admin-dashboard.html?view=pickup-dates">Pickup dates approval</a>
          <a href="admin-dashboard.html?view=approved-fields">Ticket Center</a>
          <a href="admin-dashboard.html?view=accounts">Manage accounts</a>
          <a href="admin-analysis.html">Analysis</a>
          <a class="active" href="admin-audit.html">Audit log</a>
          <div class="nav-footer"><button class="side-logout" id="logout" type="button">Log out</button></div>
        </nav>
      </aside>
      <section class="page">
        <header class="header">
          <div>
            <p class="eyebrow">Administrator only</p>
            <h1>Audit log</h1>
            <p class="muted">Review up to 500 of the latest recorded actions, including ticket deletions.</p>
          </div>
        </header>
        <section class="toolbar" aria-label="Audit log controls">
          <div class="filter"><label for="search">Search</label><input id="search" type="search" placeholder="Action, email, ticket ID, reason or amount" /></div>
          <span class="count" id="count"></span>
        </section>
        <div id="results" aria-live="polite"></div>
      </section>
    </main>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const navToggle = $('#navToggle');
      const operationsNav = $('#operationsNav');
      navToggle?.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!expanded));
        operationsNav.classList.toggle('is-open', !expanded);
      });
      let events = [];
      const displayDate = (value) => {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Unknown date' : new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
      };
      const detailLines = (details) => Object.entries(details || {}).filter(([, value]) => value !== '' && value !== null && typeof value !== 'undefined');
      const addDetail = (cell, details) => {
        const wrap = document.createElement('div');
        wrap.className = 'detail';
        const lines = detailLines(details);
        if (!lines.length) wrap.textContent = '—';
        lines.forEach(([label, value]) => {
          const line = document.createElement('div');
          const key = document.createElement('b');
          key.textContent = `${label}: `;
          line.append(key, document.createTextNode(typeof value === 'object' ? JSON.stringify(value) : String(value)));
          wrap.append(line);
        });
        cell.append(wrap);
      };
      function render() {
        const query = $('#search').value.trim().toLocaleLowerCase();
        const filtered = events.filter((event) => JSON.stringify(event).toLocaleLowerCase().includes(query));
        $('#count').textContent = `${filtered.length.toLocaleString('en-KE')} event${filtered.length === 1 ? '' : 's'} shown`;
        const target = $('#results');
        if (!filtered.length) {
          target.replaceChildren(Object.assign(document.createElement('div'), { className: 'empty', textContent: query ? 'No audit events match your search.' : 'No audit events have been recorded yet.' }));
          return;
        }
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Recorded</th><th>Action</th><th>Performed by</th><th>Target</th><th>Details</th></tr></thead>';
        const body = document.createElement('tbody');
        filtered.forEach((event) => {
          const row = document.createElement('tr');
          [displayDate(event.createdAt), event.action || 'Unknown action', `${event.actor?.email || 'System'} (${event.actor?.role || 'system'})`].forEach((value) => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.append(cell);
          });
          const target = document.createElement('td');
          addDetail(target, event.target);
          row.append(target);
          const metadata = document.createElement('td');
          addDetail(metadata, event.metadata);
          row.append(metadata);
          body.append(row);
        });
        table.append(body);
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        wrap.append(table);
        target.replaceChildren(wrap);
      }
      async function load() {
        const session = await fetch('/api/admin-session');
        if (!session.ok) return location.assign('admin-login.html');
        try {
          const response = await fetch('/api/admin/security-audit');
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Unable to load the audit log.');
          events = data.events || [];
          render();
        } catch (error) {
          $('#results').replaceChildren(Object.assign(document.createElement('div'), { className: 'empty', textContent: error.message || 'Unable to load the audit log.' }));
        }
      }
      $('#search').addEventListener('input', render);
      $('#logout').addEventListener('click', async () => { await fetch('/api/admin-logout', { method: 'POST' }); location.assign('admin-login.html'); });
      load();
    </script>
  </body>
</html>
